<!DOCTYPE html>
<html>
<head>
    <title>Study Planner</title>
</head>
<body>
    <h2>Smart Study Planner</h2>

    <form method="POST">
        Subject: <input type="text" name="subject" required><br><br>
        Chapters: <input type="number" name="chapters" required><br><br>
        Days: <input type="number" name="days" required><br><br>
        <button type="submit">Generate Plan</button>
    </form>

    <h3>Study Plan:</h3>
    <ul>
        {% for p in plan %}
            <li>{{ p }}</li>
        {% endfor %}
    </ul>
</body>
</html>
